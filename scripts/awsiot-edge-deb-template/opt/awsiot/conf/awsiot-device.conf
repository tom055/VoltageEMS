# AWS IoT terminal agent configuration
# All paths below are device-local paths on the edge device.

[aws]
# AWS region for Fleet Provisioning and MQTT.
region = us-east-1
# AWS IoT Core data endpoint used by both claim provisioning and runtime MQTT.
mqtt_endpoint = d08715432na143627x533-ats.iot.us-east-1.amazonaws.com
# Thing name is generated as Greengrass-{device_sn}.
thing_name_prefix = Greengrass-
# Existing AWS IoT Thing Group to place the device into during provisioning.
thing_group_name = GreengrassQuickStartGroup
# Device serial number source used to derive the Thing name.
device_sn_source = /proc/device-tree/serial-number

[claim]
# Root CA and claim certificate used only for the initial provisioning session.
root_ca_path = /opt/awsiot/certs/AmazonRootCA1.pem
cert_path = /opt/awsiot/certs/claim-certificate.pem.crt
key_path = /opt/awsiot/certs/claim-private.pem.key

[provisioning]
# Fleet Provisioning template used on first boot to create the Thing and device certificate.
template_name = GreengrassFleetProvisionTemplate
# Thing type assigned during the first successful provisioning flow.
thing_type_name = EdgeGateway
# MQTT connect timeout for the provisioning client.
connect_timeout_seconds = 30
# Maximum time to wait for create-certificate and register-thing responses.
provision_timeout_seconds = 60

[mqtt]
# MQTT broker port.
port = 8883
# Root CA for the runtime MQTT connection after provisioning succeeds.
ca_path = /opt/awsiot/certs/AmazonRootCA1.pem
# The service writes the newly created device certificate here after successful registration.
cert_path = /opt/awsiot/certs/device.pem.crt
# The service writes the newly created device private key here after successful registration.
key_path = /opt/awsiot/certs/device.private.pem.key
# MQTT connect timeout for the runtime client.
connect_timeout_seconds = 30

[thing_sync]
# When enabled, the service verifies via AWS IoT control plane that the Thing still exists
# before trusting the local runtime certificate.
check_aws_thing_existence = true
# If the AWS-side check cannot run, keep using the local runtime state instead of failing startup.
allow_local_fallback_on_check_error = true
# AWS IoT credential provider endpoint used to fetch temporary credentials with the device certificate.
credential_provider_endpoint = c2nk81wpfqt9qh.credentials.iot.us-east-1.amazonaws.com
# Role alias used by the credential provider flow.
role_alias = AwsiotTerminalDeviceRoleAlias

[thing_tags]
# Static Thing attributes synced to AWS IoT after MQTT connects.

[agent]
# Session state file used to coordinate connect/disconnect handshake.
session_state_path = /opt/awsiot/state/session-state.json
# Shell used to run the persistent remote session.
shell_path = /bin/bash
# Default and maximum session lifetime in minutes.
default_session_timeout_minutes = 10
max_session_timeout_minutes = 1440
# Default and maximum command runtime in seconds.
command_timeout_seconds = 30
max_timeout_seconds = 300
# When true, commands are executed on the host namespaces with nsenter.
run_on_host = false
